<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tu Tiên Vực Support Admin</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="admin.css"></head><body>
<div class="login-wrap" id="loginWrap"><form class="login-card" id="loginForm"><div class="logo"><span>X</span><b>Tu Tiên<em>Vực</em></b></div><h1>Support Admin</h1><p>Đăng nhập tài khoản quản trị để xem và trả lời người chơi.</p><label>Email<input id="email" type="email" required autocomplete="username"></label><label>Mật khẩu<input id="password" type="password" required autocomplete="current-password"></label><button>ĐĂNG NHẬP</button><small id="loginError"></small></form></div>
<div class="app" id="app"><header><div class="logo"><span>X</span><b>Tu Tiên<em>Vực</em></b></div><div><strong>SUPPORT ADMIN</strong><button id="soundToggle" type="button" title="Bật/tắt âm báo">🔔 Âm: Bật</button><button id="logout">Đăng xuất</button></div></header><main><aside><div class="tools"><input id="search" placeholder="Tìm tên / ID / Zalo..."><button id="refresh">↻</button></div><div class="filters"><button class="active" data-filter="all">Tất cả</button><button data-filter="open">Đang hỗ trợ</button><button data-filter="closed">Đã xử lý</button></div><div id="list" class="list"></div></aside><section><div class="player" id="player">Chọn một người chơi để hỗ trợ</div><div class="admin-meta hidden" id="adminMeta"><div class="meta-field"><label>Tên ghi nhớ</label><input id="adminAlias" maxlength="80" placeholder="VD: Hùng test / Khách VIP..."></div><div class="meta-field note-field"><label>Ghi chú nội bộ <span>• chỉ Admin thấy</span></label><input id="adminNote" maxlength="250" placeholder="VD: Đã cấp code / cần gọi lại..."></div><button id="saveMeta" type="button">LƯU</button><small id="metaStatus"></small></div><div class="chat-search hidden" id="chatSearch"><input id="chatSearchInput" placeholder="Tìm trong đoạn chat..."><span id="chatSearchCount">0 / 0</span><button id="chatSearchPrev" type="button" title="Kết quả trước">↑</button><button id="chatSearchNext" type="button" title="Kết quả sau">↓</button><button id="chatSearchClose" type="button" title="Đóng">×</button></div><div class="messages" id="messages"></div><div class="statusbar"><button id="openChatSearch" type="button" disabled>🔍 Tìm tin nhắn</button><button id="toggleStatus" disabled>Đánh dấu đã xử lý</button></div><div class="image-preview hidden" id="adminImagePreview"></div><form id="form"><input id="adminImageInput" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden><button class="image-pick" id="adminImagePick" type="button" disabled title="Gửi hình ảnh">🖼</button><input id="input" placeholder="Trả lời người chơi..." disabled><button class="send-btn" disabled>GỬI</button></form></section></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="admin.js"></script></body></html>
